name: preview-context-link
# Cloudflare's GitHub integration deploys the split app automatically.
# This action adds a second link to the full consolidated-site context preview, which is staged in unclehowell/cedwyn. — Sion's Tab agent
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  pull-requests: write
jobs:
  preview-context:
    runs-on: ubuntu-latest
    steps:
      - name: Post the full-site context preview
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: https://staging-mr-wolf-v2-1-0-previ.cedwyn-274.pages.dev/mr-wolf/
          STAGING_BRANCH: staging/mr-wolf-v2.1.0-preview
          STAGING_COMMIT: 9b9cafd1d7aedf2b6c8b665218c3b25f3e4c6817
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const branch = process.env.STAGING_BRANCH;
            const sha = process.env.STAGING_COMMIT;
            const body = `Full-site context preview: ${url}

            This is a supplementary snapshot served by the consolidated cedwyn Pages project from branch ${branch} (staged commit ${sha}). It shows Mr Wolf inside the wider Cedwyn site. It is not the primary PR preview and does not change the production site branch or custom domains.

            The primary, automatically generated app preview is in the Cloudflare Pages GitHub integration comment on this PR. This full-site snapshot is staged separately and must be refreshed if this PR receives further content changes.`;
            const {owner, repo} = context.repo;
            const issue_number = context.payload.pull_request.number;
            const cs = await github.rest.issues.listComments({owner, repo, issue_number});
            const mine = cs.data.find(c => c.body.startsWith('Full-site context preview: '));
            if (mine) await github.rest.issues.updateComment({owner, repo, comment_id: mine.id, body});
            else await github.rest.issues.createComment({owner, repo, issue_number, body});
