name: preview-link
# Cloudflare Pages is connected to unclehowell/cedwyn, not this split repository.
# Its existing project allows staging/* preview branches. This workflow links the staged snapshot;
# it deliberately does not deploy, change production, or require a second Pages project/API token. — Sion's Tab agent
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  pull-requests: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Post the Cloudflare staging preview
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: https://staging-mr-wolf-v2-1-0-previ.cedwyn-274.pages.dev/mr-wolf/
          STAGING_BRANCH: staging/mr-wolf-v2.1.0-preview
          STAGING_COMMIT: 9b9cafd1d7aedf2b6c8b665218c3b25f3e4c6817
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const branch = process.env.STAGING_BRANCH;
            const sha = process.env.STAGING_COMMIT;
            const body = `Cloudflare Pages preview: ${url}

            This review snapshot is served by the existing consolidated cedwyn Pages project from branch ${branch} (staged commit ${sha}). It is an isolated preview and does not change the production site branch or custom domains.

            Snapshot note: this preview is staged separately from this split-repository PR. If this PR receives further content changes, refresh the staging snapshot and verify a new Cloudflare deployment before treating the preview as current.`;
            const {owner, repo} = context.repo;
            const issue_number = context.payload.pull_request.number;
            const cs = await github.rest.issues.listComments({owner, repo, issue_number});
            const mine = cs.data.find(c => c.body.startsWith('Cloudflare Pages preview: '));
            if (mine) await github.rest.issues.updateComment({owner, repo, comment_id: mine.id, body});
            else await github.rest.issues.createComment({owner, repo, issue_number, body});
